{% include 'navbar.html' %}

<!DOCTYPE html>
<html>
<head>
<style>

body{
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    margin:0;
    min-height: 100vh;
    position: relative;
}

/* باربر شوب background decoration */
body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" opacity="0.05"><path d="M12 2L15 8.5L22 9.5L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9.5L9 8.5L12 2z"/></svg>') repeat;
    background-size: 40px;
    pointer-events: none;
}

/* center container */
.container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height: 90vh;
    position: relative;
    z-index: 1;
}

/* box - باربر شوب style */
.form-box{
    background: white;
    padding: 40px;
    width: 360px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
}

.form-box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1);
}

.form-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.2);
}

/* title with barber icon */
h2{
    text-align: center;
    margin-bottom: 25px;
    color: #333;
    font-size: 28px;
    font-weight: 600;
    position: relative;
    padding-bottom: 15px;
}

h2::after {
    content: '✂️';
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    opacity: 0.5;
}

/* inputs */
.form-box input{
    width: 100%;
    padding: 14px 12px;
    margin-top: 8px;
    margin-bottom: 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.3s ease;
    font-family: inherit;
    box-sizing: border-box;
}

.form-box input:focus {
    outline: none;
    border-color: #ff6b6b;
    box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
}

.form-box input:hover {
    border-color: #ff6b6b;
}

/* placeholder styling */
.form-box input::placeholder {
    color: #aaa;
    font-style: italic;
}

/* login button - barber style */
.form-box input[type="submit"]{
    background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    padding: 14px;
    margin-top: 10px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.form-box input[type="submit"]:hover{
    background: linear-gradient(135deg, #ff8e53 0%, #ff6b6b 100%);
    transform: scale(0.98);
    box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
}

/* register button - barber style */
.register-btn{
    display:block;
    text-align:center;
    padding:14px;
    background: linear-gradient(135deg, #4ecdc4 0%, #45b7d1 100%);
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-weight:bold;
    margin-top:15px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 14px;
}

.register-btn:hover{
    background: linear-gradient(135deg, #45b7d1 0%, #4ecdc4 100%);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(78, 205, 196, 0.3);
    color: white;
}

/* text */
.register-text{
    text-align:center;
    margin-top:20px;
    font-size:14px;
    color: #666;
    position: relative;
}

/* flash messages with barber theme */
.messages{
    list-style: none;
    padding: 0;
    margin-bottom: 20px;
}

.messages li{
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    font-size: 14px;
    animation: slideIn 0.3s ease;
    font-weight: 500;
}

@keyframes slideIn {
    from {
        transform: translateY(-10px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.messages .error{
    background: linear-gradient(135deg, #ffe5e5 0%, #fff0f0 100%);
    color: #d63031;
    border-left: 4px solid #d63031;
}

.messages .success{
    background: linear-gradient(135deg, #e7f9ed 0%, #f0fff4 100%);
    color: #27ae60;
    border-left: 4px solid #27ae60;
}

.messages .info {
    background: linear-gradient(135deg, #e3f2fd 0%, #f0f8ff 100%);
    color: #2980b9;
    border-left: 4px solid #2980b9;
}

.messages .warning {
    background: linear-gradient(135deg, #fff3e0 0%, #fff8f0 100%);
    color: #f39c12;
    border-left: 4px solid #f39c12;
}

/* barber shop decoration */
.form-box::after {
    content: '✂️ 💈 ✂️';
    position: absolute;
    bottom: 10px;
    right: 15px;
    font-size: 12px;
    opacity: 0.3;
    pointer-events: none;
}

/* input labels */
label {
    font-size: 13px;
    font-weight: 600;
    color: #555;
    display: block;
    margin-bottom: 5px;
}

/* responsive design */
@media (max-width: 480px) {
    .form-box {
        margin: 20px;
        padding: 30px 20px;
        width: auto;
    }
    
    h2 {
        font-size: 24px;
    }
    
    .form-box input {
        padding: 12px;
    }
}

/* loading animation for submit */
.form-box input[type="submit"]:active {
    transform: scale(0.96);
}

/* custom checkbox style if needed later */
input[type="checkbox"] {
    width: auto;
    margin-right: 8px;
    transform: scale(1.1);
}

.remember-me {
    display: flex;
    align-items: center;
    margin: -10px 0 20px 0;
    font-size: 13px;
    color: #666;
}

/* social login option (optional for barbershop) */
.social-login {
    text-align: center;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #e0e0e0;
}

.social-login p {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
}

.social-icons {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.social-icon {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: #f5f5f5;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #666;
    transition: all 0.3s ease;
}

.social-icon:hover {
    transform: translateY(-2px);
    background: #ff6b6b;
    color: white;
}

/* barbershop themed placeholder icons */
.form-box input[name="username"] {
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="%23999" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>');
    background-repeat: no-repeat;
    background-position: 12px center;
    background-size: 18px;
    padding-left: 38px;
}

.form-box input[name="password"] {
    background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="%23999" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>');
    background-repeat: no-repeat;
    background-position: 12px center;
    background-size: 18px;
    padding-left: 38px;
}

</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

<div class="form-box">

<h2>Barber Shop Login</h2>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li class="{{ message.tags }}">{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

<form method="post">
{% csrf_token %}

<label for="username">Email Address</label>
<input type="text" id="username" name="username" placeholder="Enter your email address">

<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter your password">

<div class="remember-me">
    <input type="checkbox" id="remember" name="remember">
    <label for="remember" style="display: inline; margin: 0;">Remember me</label>
</div>

<input type="submit" value="Login to Barber Shop">

</form>

<div class="register-text">
    ✂️ Don't have an account? ✂️
</div>

<a href="{% url 'reg' %}" class="register-btn">Create Account</a>

<div class="social-login">
    <p>Or login with</p>
    <div class="social-icons">
        <a href="#" class="social-icon">📱</a>
        <a href="#" class="social-icon">📘</a>
        <a href="#" class="social-icon">📷</a>
    </div>
</div>

</div>

</div>

</body>
</html>
